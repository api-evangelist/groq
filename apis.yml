aid: groq
url: https://raw.githubusercontent.com/api-evangelist/groq/refs/heads/main/apis.yml
name: Groq
kind: company
description: Groq builds custom Language Processing Unit (LPU) silicon optimized for
  low-latency LLM inference. The GroqCloud API serves popular open models (Llama,
  GPT OSS, Whisper, Orpheus) at industry-leading tokens-per-second with an OpenAI-compatible
  interface.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
- AI
- LLM
- Inference
- LPU
- Low Latency
created: '2026-05-08'
modified: '2026-05-29'
specificationVersion: '0.19'
