description: >-
  GroqCloud uses a transparent pay-as-you-go pricing model with linear,
  predictable per-token rates per model. Audio is billed per 1M characters
  (TTS) or per hour transcribed (STT). Tools are priced per call or per
  compute hour. The Batch API offers a 50% discount; Prompt Caching offers a
  50% discount on cached input tokens. There are no formal Free / Developer /
  Enterprise tiers; users start with free access and pay for usage.
notes: >-
  Representative model rates as published on the Groq pricing page; check
  the page for the current full model catalog and rates.
sources:
- https://groq.com/pricing
- https://console.groq.com/docs
plans:
