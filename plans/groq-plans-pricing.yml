    name: llama_3_1_8b
    type: usage
    metric: tokens
    limit: -1
    timeFrame: month
    geo: global
    unit: 1000000
    price: $0.05 input / $0.08 output per 1M
    userMultiplied: false
  - label: GPT OSS 20B
